# Backend — Fly.io app config.
# Run `fly launch --no-deploy --copy-config` from the REPO ROOT pointing at
# this file, then `fly deploy --config backend/fly.toml --dockerfile backend/Dockerfile`.

app = "stackwealth-backend"
primary_region = "bom"   # Mumbai — change if you'd rather host elsewhere

kill_signal = "SIGINT"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4000"
  NODE_ENV = "production"
  # FRONTEND_ORIGIN is needed for CORS — set this to your deployed frontend URL.
  # Override via: fly secrets set FRONTEND_ORIGIN=https://stackwealth-frontend.fly.dev
  FRONTEND_ORIGIN = "https://stackwealth-frontend.fly.dev"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
