# Frontend — Fly.io app config. Deploy from the REPO ROOT:
#   fly deploy --remote-only -c frontend/fly.toml
# The backend URL is baked at BUILD time (NEXT_PUBLIC_* is inlined into the
# client bundle), so the build args below are REQUIRED — without them the bundle
# falls back to http://localhost:4000 and every client fetch fails in prod.
# They live in [build.args] so a bare `fly deploy` can't drop them.

app = "stackwealth-frontend"
primary_region = "bom"

kill_signal = "SIGINT"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    NEXT_PUBLIC_BACKEND_URL = "https://stackwealth-backend-py.fly.dev"
    BACKEND_URL = "https://stackwealth-backend-py.fly.dev"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  HOSTNAME = "0.0.0.0"
  NEXT_TELEMETRY_DISABLED = "1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/advisor/clients"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
