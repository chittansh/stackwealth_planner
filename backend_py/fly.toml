app = "stackwealth-backend-py"
primary_region = "bom"

[build]

[env]
  PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/health"

[[vm]]
  # 2 DEDICATED vCPUs so a CPU-heavy LibreOffice recalc (soffice, 20-40s) runs on
  # one core while the web server keeps serving on the other — on shared-1x the
  # recalc starved the app and requests crawled. 4 GB gives the (serialized)
  # recalc + app + openpyxl workbook load comfortable headroom.
  cpu_kind = "performance"
  cpus = 2
  memory_mb = 4096
