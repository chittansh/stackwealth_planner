app = "stackwealth-backend-py"
primary_region = "bom"

[build]

[env]
  PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  # LibreOffice headless recalc (soffice) peaks at several hundred MB; with the
  # app + openpyxl loading the recalced workbook, 1 GB OOM'd the machine on
  # upload. 2 GB gives a single (serialized) recalc enough headroom.
  memory_mb = 2048
