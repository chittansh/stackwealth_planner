[project]
name = "stackwealth-backend"
version = "0.1.0"
description = "Stackwealth Planner backend — FastAPI + LangGraph"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "sse-starlette>=2.1",
  "pydantic>=2.9",
  "anthropic>=0.39",
  "openai>=1.55",
  "langgraph>=0.2.50",
  "langchain-core>=0.3",
  "langchain-anthropic>=0.3",
  "langfuse>=2.50,<3",
  "httpx>=0.27",
  "pypdf>=5.0",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "Pillow>=11.0",
  "playwright>=1.48",
  "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stackwealth"]
